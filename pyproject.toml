[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scrfear"
version = "0.1.0"
description = "Convert public fear-conditioning skin-conductance datasets to BIDS."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "h5py>=3.8",
    "numpy>=1.23.5,<2.3",
    "pandas>=2.0",
    "requests>=2.28",
    "scipy>=1.10",
]

[project.scripts]
scrfear = "converter.scrf_bids_conversion:main"

[tool.setuptools.packages.find]
include = ["converter*"]

[tool.setuptools.package-data]
converter = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
